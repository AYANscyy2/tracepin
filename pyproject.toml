[project]
name = "tracepin"
version = "0.1.0"
description = "Agent reliability toolkit: an OpenTelemetry-instrumented tool-calling agent that captures real, unforced failures."
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "pydantic>=2",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracepin"]

[project.scripts]
tracepin = "tracepin.runner:app"
